server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # O Angular usa rotas no navegador (/jogo, /login...).
    # Se o arquivo não existir, devolve o index.html e o Angular resolve a rota.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
