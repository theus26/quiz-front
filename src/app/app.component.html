<div class="santuario">
  <header class="topo">
    <div class="mx-auto flex max-w-6xl flex-wrap items-center justify-between gap-3 px-3 py-2 sm:px-4">
      <a routerLink="/" class="marca-link">
        <img src="/logo-iasd.svg" alt="Igreja Adventista do Sétimo Dia" />
        <span class="nome-jogo">Milhão<br />Bíblico</span>
      </a>
      <nav class="flex items-center gap-1 text-sm sm:gap-2" aria-label="Principal">
        <a class="nav-link hidden sm:inline" routerLink="/" routerLinkActive="nav-ativa" [routerLinkActiveOptions]="{ exact: true }">Início</a>
        <a class="nav-link" routerLink="/ranking" routerLinkActive="nav-ativa">Ranking</a>
        @if (autenticado()) {
          <a class="nav-link hidden sm:inline" routerLink="/historico" routerLinkActive="nav-ativa">Histórico</a>
          <span class="hidden max-w-32 truncate md:inline">{{ nome() }}</span>
          <button type="button" class="nav-link" (click)="sair()">Sair</button>
        } @else {
          <a class="nav-link" routerLink="/entrar" routerLinkActive="nav-ativa">Entrar</a>
          <a class="botao-ouro botao-compacto" routerLink="/cadastro">Criar conta</a>
        }
      </nav>
    </div>
  </header>

  @if (boasVindas(); as nome) {
    <div class="boas-vindas" role="status">
      <p>Seja bem-vindo, {{ nome }}.</p>
      <button type="button" (click)="fecharBoasVindas()">Fechar</button>
    </div>
  }

  <main>
    <router-outlet />
  </main>

  <footer class="rodape">
    <p>Feito por Matheus Felipe</p>
  </footer>
</div>
