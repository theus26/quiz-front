<section class="mx-auto flex min-h-[70dvh] w-full max-w-md items-center px-4 py-10">
  <form class="painel w-full" [formGroup]="formulario" (ngSubmit)="enviar()">
    <p class="text-sm text-gold">Bereia</p>
    <h1 class="mt-2 font-display text-3xl text-gold">Criar conta</h1>
    <p class="mt-2 text-sm text-parchment/70">Com uma conta, a pontuação da partida entra no ranking.</p>

    <label class="campo">
      <span>Nome</span>
      <input type="text" formControlName="nome" autocomplete="name" maxlength="120" />
    </label>
    <label class="campo">
      <span>E-mail</span>
      <input type="email" formControlName="email" autocomplete="email" />
    </label>
    <label class="campo">
      <span>Senha</span>
      <input type="password" formControlName="senha" autocomplete="new-password" />
    </label>
    <label class="campo">
      <span>Confirmar senha</span>
      <input type="password" formControlName="confirmar" autocomplete="new-password" />
    </label>

    @if (formulario.hasError('senhas') && formulario.controls.confirmar.touched) {
      <p class="text-sm text-alerta">As senhas não conferem.</p>
    }
    @if (erro()) {
      <p class="text-sm text-alerta" role="alert">{{ erro() }}</p>
    }

    <button class="botao-ouro mt-2 w-full" type="submit" [disabled]="enviando()">
      {{ enviando() ? 'Criando...' : 'Criar conta e entrar' }}
    </button>
    <p class="text-center text-sm text-parchment/70">
      Já tem conta?
      <a class="text-gold" routerLink="/entrar" [queryParams]="{ retorno: destino() }">Entrar</a>
    </p>
  </form>
</section>
